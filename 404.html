<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Paiement Décrypté</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  @font-face{font-family:'Bricolage Grotesque';src:url('/assets/fonts/bricolage-grotesque-var.woff2') format('woff2');font-weight:200 800;font-display:swap}
  @font-face{font-family:'Instrument Sans';src:url('/assets/fonts/instrument-sans-var.woff2') format('woff2');font-weight:400 700;font-display:swap}
  @font-face{font-family:'JetBrains Mono';src:url('/assets/fonts/jetbrains-mono-var.woff2') format('woff2');font-weight:100 800;font-display:swap}
  :root{
    --bg:#F2F4F8; --ink:#0E1B2C; --ink-soft:#4A5A70;
    --cobalt:#1F4FD8; --mint:#17B587; --coral:#E85C4A; --line:#D8DEE9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Instrument Sans',system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    min-height:100dvh;display:flex;justify-content:center;align-items:center;
    padding:24px 20px;
  }
  .app{width:100%;max-width:480px}
  .mark{width:44px;height:44px;display:block;margin-bottom:22px}
  .code{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;
    color:var(--coral);margin-bottom:10px;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:clamp(30px,8vw,38px);line-height:1.08;letter-spacing:-.01em;
    margin-bottom:12px;
  }
  p{color:var(--ink-soft);font-size:15.5px;margin-bottom:6px}
  p.en{font-size:14px}
  .cta{
    display:inline-block;margin-top:22px;background:var(--cobalt);color:#fff;
    font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;text-decoration:none;
  }
  .cta.ghost{background:transparent;color:var(--cobalt);border:1.5px solid var(--cobalt);margin-left:8px}
  .segs{display:flex;gap:6px;margin-top:34px}
  .segs i{width:34px;height:6px;border-radius:3px;background:var(--line);display:block}
  .segs i:first-child{background:var(--coral)}
</style>
</head>
<body>
<div class="app">
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <defs>
      <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1F4FD8"/>
        <stop offset="100%" stop-color="#17B587"/>
      </linearGradient>
    </defs>
    <rect x="1.5" y="1.5" width="37" height="37" rx="9" fill="url(#markGrad)"/>
    <rect x="9" y="11" width="22" height="18" rx="3.5" fill="none" stroke="#fff" stroke-width="2.4"/>
    <line x1="20" y1="11" x2="20" y2="29" stroke="#fff" stroke-width="2"/>
    <line x1="9" y1="20" x2="31" y2="20" stroke="#fff" stroke-width="2"/>
  </svg>
  <p class="code">ERREUR 404 · TRANSACTION REFUSÉE</p>
  <h1>Cette page n'existe pas.</h1>
  <p>Le lien est peut-être périmé – ou l'épisode n'est pas encore publié.</p>
  <p class="en" lang="en">This page doesn't exist. The link may be outdated – or the episode isn't out yet.</p>
  <a class="cta" href="/">Retour à l'accueil</a><a class="cta ghost" href="/en/" hreflang="en" lang="en">English home</a>
  <div class="segs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</div>
</body>
</html>
